<!doctype html>

<head>
<meta charset="utf-8">

<title>Top 200 Spotify</title>
<meta name="description" content="Explore six years of the global Spotify Top 200 (2017–2023): where hits come from, which artists dominate, how songs climb the chart and what they sound like. PV251 student project.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="app">
  <header class="top" id="top"></header>

    <div id="view"><div class="loading"><div class="spinner"></div>Loading six years of charts…</div></div>
    <footer class="foot">Student project (PV251, FI MUNI) · data: Kaggle “Top 200 Spotify Songs” (daily global chart 1 Jan 2017 – 29 May 2023) · not affiliated with Spotify</footer>
  </main>
  <aside class="panel np" id="np" aria-label="Now playing"><div class="skel" style="height:100%"></div></aside>
  <footer class="player" id="player"></footer>
</div>
<div id="tip" role="tooltip"></div>
